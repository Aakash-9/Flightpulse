# Log settings for the interactive demo shell only. Keeps real warnings and errors, but hides three harmless ones that
# would put stack traces or noise in front of an audience: the loopback-hostname notice, the missing native Hadoop
# library notice, and Spark 4.2 failing to delete an already-removed temp folder when the shell exits.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
logger.javautils.name = org.apache.spark.network.util.JavaUtils
logger.javautils.level = off
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
logger.sparkutils.name = org.apache.spark.util.Utils
logger.sparkutils.level = error
